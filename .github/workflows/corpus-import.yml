name: Corpus importer

on:
  pull_request:
    paths:
      - ".github/workflows/corpus-import.yml"
      - "src/text_fetch/**"
      - "tests/test_corpus.py"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: read

jobs:
  import:
    name: Import Markdown and TXT (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra dev --no-editable
      - run: uv run --no-sync text-fetch corpus import --help
      - run: uv run --no-sync pytest -q tests/test_corpus.py
