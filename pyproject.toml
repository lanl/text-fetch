[project]
name = "text-fetch"
version = "0.1.0"
description = "A tool to fetch and convert PDF documents to JATS XML format"
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
dependencies = [
    "requests>=2.31.0",
    "lxml>=4.9.0",
    "pdfminer-six>=20221105",
    "unidecode>=1.3.0",
]
requires-python = ">=3.8"

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"
